
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header class="topbar">

        <h1>Admin Dashboard</h1>

        <button type="button" onclick="logout()">
            Logout
        </button>

    </header>


    <main class="container">

        <!-- COMMON MESSAGE -->

        <p id="message" class="message"></p>


        <!-- CREATE MANAGER -->

        <section class="panel">

            <h2>Create Manager</h2>

            <form id="managerForm">

                <label for="full_name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full_name"
                    required
                    minlength="3"
                >


                <label for="manager_email">
                    Email
                </label>

                <input
                    type="email"
                    id="manager_email"
                    required
                >


                <label for="manager_phone">
                    Phone
                </label>

                <input
                    type="text"
                    id="manager_phone"
                    required
                    minlength="10"
                    maxlength="15"
                >


                <label for="manager_password">
                    Password
                </label>

                <input
                    type="password"
                    id="manager_password"
                    required
                    minlength="8"
                >


                <button type="submit">
                    Create Manager
                </button>

            </form>

        </section>


        <!-- MANAGE MANAGERS -->

        <section class="panel">

            <h2>Manage Managers</h2>

            <button
                type="button"
                onclick="loadManagers()"
            >
                Refresh Managers
            </button>

            <div id="managers"></div>

        </section>


        <!-- REGISTER EMPLOYEE -->

        <section class="panel">

            <h2>Register Employee</h2>

            <form id="registerEmployeeForm">

                <label for="employee_name">
                    Employee Name
                </label>

                <input
                    type="text"
                    id="employee_name"
                    required
                >


                <label for="employee_email">
                    Email
                </label>

                <input
                    type="email"
                    id="employee_email"
                    required
                >


                <label for="employee_phone">
                    Phone
                </label>

                <input
                    type="text"
                    id="employee_phone"
                    required
                    minlength="10"
                    maxlength="15"
                >


                <label for="employee_password">
                    Password
                </label>

                <input
                    type="password"
                    id="employee_password"
                    required
                    minlength="8"
                >


                <label for="department">
                    Department
                </label>

                <input
                    type="text"
                    id="department"
                    required
                >


                <label for="designation">
                    Designation
                </label>

                <input
                    type="text"
                    id="designation"
                    required
                >


                <label for="manager_id">
                    Select Manager
                </label>

                <select id="manager_id" required>

                    <option value="">
                        Select Manager
                    </option>

                </select>


                <button type="submit">
                    Register Employee
                </button>

            </form>

        </section>


        <!-- EMPLOYEE DETAILS -->

        <section class="panel">

            <h2>Employee Details</h2>

            <button
                type="button"
                onclick="loadEmployees()"
            >
                Refresh Employees
            </button>

            <div id="employees"></div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="/static/app.js"></script>

    <script>

        document.addEventListener("DOMContentLoaded", async function () {

            await requireDashboard("Admin");

            await loadManagers();

            await loadEmployees();

        });

    </script>

</body>

</html>
